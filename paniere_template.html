<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Paniere Scorri Lezioni - 0052509MFIL03NM</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            padding: 8px 15px 15px 15px;
            max-width: 210mm;
            margin: 0 auto;
            background: #f5f5f5;
        }
        
        .container {
            background: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .header {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 11px;
            color: #0fabbc;
            font-weight: bold;
        }

        .title-band {
            background: linear-gradient(-45deg, #34e89e, #0fabbc, #43aaf3, #66d9e8);
            margin: -20px -20px 15px -20px;
            padding: 18px 20px;
            border-radius: 6px 6px 0 0;
        }

        h1 {
            margin: 0;
            font-size: 23px;
            font-weight: 700;
        }

        h1 a {
            color: white;
            text-decoration: none;
        }
        
        /* ========== SEZIONI QUIZ (quiz multipli) ========== */

        .quiz-section {
            margin: 15px 0;
            page-break-inside: auto;
            page-break-after: avoid;
            padding: 10px;
        }

        .quiz-header {
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #d0d0d0;
        }
        
        .quiz-numero {
            background: #0fabbc;
            color: white;
            padding: 6px 14px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 2px 4px rgba(15, 171, 188, 0.3);
            flex-shrink: 0;
        }

        .quiz-nome {
            font-weight: 700;
            font-size: 15px;
            color: #222;
            flex: 1;
            line-height: 1.3;
        }

        .quiz-posizione {
            font-size: 11px;
            color: #666;
            background: white;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
            white-space: nowrap;
            font-weight: 500;
        }
        
        /* Modifica domanda per quiz multipli */
        .quiz-section .domanda {
            margin: 6px 0;
            background: white;
            border-left-width: 2px;
        }

        .quiz-section .domanda:first-of-type {
            margin-top: 0;
        }

        .quiz-section .domanda:last-of-type {
            margin-bottom: 0;
        }

        /* ========== DOMANDE ========== */

        .domanda {
            margin: 2px 0;
            page-break-inside: avoid;
            background: #fafafa;
            padding: 6px 10px;
            border-radius: 4px;
            border-left: 2px solid #0fabbc;
        }

        .domanda-header {
            display: flex;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .domanda-numero {
            background: #0fabbc;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            text-align: center;
            line-height: 20px;
            margin-right: 8px;
            flex-shrink: 0;
            font-weight: bold;
            font-size: 10px;
            box-shadow: 0 2px 4px rgba(15, 171, 188, 0.25);
        }

        .domanda-testo {
            font-weight: 600;
            font-size: 12px;
            line-height: 1.3;
            color: #333;
        }

        .risposte {
            margin-left: 0;
        }

        .risposta {
            margin: 3px 0;
            padding: 4px 8px;
            border-radius: 3px;
            display: flex;
            align-items: center;
        }

        .risposta-lettera {
            font-weight: bold;
            margin-right: 6px;
            min-width: 18px;
            font-size: 10px;
        }

        .corretta {
            background: linear-gradient(135deg, #e8f5e8 0%, #d4edda 100%);
            border: 1px solid #1B7A37;
            color: #155724;
            font-weight: 500;
        }

        .corretta .risposta-lettera {
            color: #1B7A37;
            font-weight: bold;
        }

        .corretta::after {
            content: '✓';
            margin-left: auto;
            color: #1B7A37;
            font-size: 14px;
            font-weight: bold;
        }

        .sbagliata {
            background: white;
            border: 1px solid #e0e0e0;
            color: #757575;
            font-size: 10px;
        }

        .footer {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            font-size: 11px;
            color: #999;
        }
        
        @media print { 
            body { 
                padding: 5mm 10mm 10mm 10mm; 
                background: white; 
            }
            
            .container { 
                box-shadow: none; 
                padding: 0; 
            }
            
            .quiz-section {
                page-break-inside: avoid;
                background: white;
                margin: 15px 0;
                padding: 12px;
            }
            
            .quiz-header {
                background: #f0f0f0 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                page-break-after: avoid;
            }
            
            .quiz-numero {
                background: #0b6623 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            
            .domanda { 
                page-break-inside: avoid;
                background: white;
                border: 1px solid #ddd;
                margin: 12px 0;
                padding: 10px 12px;
            }
            
            .corretta {
                background: #e8f5e8 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .title-band {
                margin: 0 0 12px 0;
                background: #0fabbc !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                page-break-after: avoid;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-band">
            <h1>{{TITLE}}</h1>
        </div>
        {{QUESTIONS_HTML}}
        <div class="footer">
            {{TITLE}}
        </div>
    </div>
    <script>
        window.onload = () => setTimeout(() => window.print(), 1000);
    </script>
</body>
</html>
