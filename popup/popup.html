<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Unipegaso Unlocker</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 300px;
      font-family: -apple-system, 'Segoe UI', system-ui, Arial, sans-serif;
      background: transparent;
      color: #111;
    }

    :root {
      --accent:       #0fabbc;
      --accent-light: #f0fbfc;
      --accent-text:  #0a8a97;
    }

    .popup-wrap {
      margin: 8px;
      border-radius: 18px;
      overflow: hidden;
      background: #f0f0f5;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.10);
      border: 1px solid rgba(0,0,0,0.08);
    }

    /* ── HEADER ── */
    .header {
      background: #fff;
      padding: 12px 15px 10px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #eeeef2;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo-svg { width: 32px; height: 32px; flex-shrink: 0; }
    .header-name { font-size: 13px; font-weight: 700; color: #111; letter-spacing: -0.1px; }
    .header-sub  { font-size: 10px; color: #c0c0c8; margin-top: 1px; text-decoration: none; }
    .header-sub:hover { color: var(--accent); text-decoration: underline; }

    /* ── TOGGLE ── */
    .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .slider-track {
      position: absolute; inset: 0;
      background: #e2e2e8; border-radius: 12px;
      cursor: pointer; transition: background 0.2s;
    }
    .slider-track::before {
      content: ''; position: absolute;
      width: 18px; height: 18px; border-radius: 50%;
      background: #fff; top: 3px; left: 3px;
      transition: transform 0.2s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.18);
    }
    input:checked + .slider-track { background: var(--accent); }
    input:checked + .slider-track::before { transform: translateX(18px); }

    /* ── BANNER RECENSIONE ── */
    .review-banner {
      padding: 9px 13px; background: #fffbeb;
      border-bottom: 1px solid #fde68a;
      display: flex; align-items: center; gap: 9px;
    }
    .review-banner.hidden { display: none; }
    .review-text { flex: 1; }
    .review-text strong { font-size: 11px; color: #92400e; font-weight: 700; display: block; }
    .review-text span   { font-size: 10px; color: #b45309; }
    .review-btns { display: flex; flex-direction: column; gap: 4px; }
    .btn-review-sm {
      padding: 4px 11px; background: var(--accent); color: #fff;
      border: none; border-radius: 8px; font-size: 10px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
    }
    .btn-dismiss-sm {
      padding: 3px 11px; background: transparent; color: #c0c0c8;
      border: 1px solid #e8e8ee; border-radius: 8px; font-size: 10px;
      cursor: pointer; white-space: nowrap;
    }

    /* ── STATUS BAR ── */
    .status-bar {
      padding: 6px 15px;
      display: flex; align-items: center; gap: 7px;
      background: var(--accent-light);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      transition: background 0.3s;
    }
    .status-bar.off  { background: #fff5f5; }
    .status-bar.info { background: #f5f5f7; }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
    }
    .status-bar.off  .status-dot { background: #e53935; }
    .status-bar.info .status-dot { background: #ccc; }
    .status-bar span { font-size: 11px; font-weight: 500; color: var(--accent-text); line-height: 1.5; }
    .status-bar.off  span { color: #c62828; }
    .status-bar.info span { color: #888; }

    /* ── SETTINGS ── */
    .settings { padding: 10px 11px; display: flex; flex-direction: column; gap: 8px; }

    .setting-row {
      background: #fff; border: 1px solid #eeeef2;
      border-radius: 14px; padding: 11px 13px;
    }
    .setting-label {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 9px;
    }
    .setting-label span:first-child { font-size: 12px; font-weight: 600; color: #222; }
    .setting-value { font-size: 12px; font-weight: 700; color: var(--accent); }

    input[type="range"] {
      width: 100%; -webkit-appearance: none; appearance: none;
      height: 3px; background: #e8e8ee; border-radius: 3px; outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px; height: 15px;
      background: var(--accent); border-radius: 50%;
      cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .setting-desc { font-size: 10px; color: #c8c8d0; margin-top: 7px; }

    /* ── MODALITÀ AVANZAMENTO ── */
    .mode-switch { display: flex; gap: 5px; }
    .mode-btn {
      flex: 1; padding: 6px 4px; border-radius: 9px;
      border: 1.5px solid #eeeef2; background: #f5f5f8;
      color: #aaa; font-size: 10px; font-weight: 600;
      cursor: pointer; transition: all 0.15s; line-height: 1.3; text-align: center;
    }
    .mode-btn.active {
      background: var(--accent-light); border-color: var(--accent); color: var(--accent-text);
    }

    /* ── LICENZA ── */
    .license-row {
      background: #fff; border: 1px solid #eeeef2;
      border-radius: 14px; padding: 9px 13px;
      font-size: 11px; color: #aaa; text-align: center;
      display: none;
    }
    .license-row.visible { display: block; }
    .license-row.valid   { color: #16a34a; }
    .license-row.invalid { color: #e53935; }
    .buy-link {
      color: var(--accent); text-decoration: underline; cursor: pointer;
    }

    /* ── ALERT ── */
    .alert {
      display: none;
      padding: 8px 12px; border-radius: 10px;
      font-size: 11px; line-height: 1.4; text-align: center;
    }
    #errorArea   { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; }
    #warningArea { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
    #infoArea    { background: var(--accent-light); border: 1px solid #b2e8ee; color: var(--accent-text); }

    /* ── FOOTER ── */
    .footer {
      border-top: 1px solid #eeeef2; padding: 8px 15px;
      display: flex; align-items: center; justify-content: space-between;
      background: #fff;
    }
    .footer-v { font-size: 10px; color: #ddd; }
    .footer a  {
      font-size: 10px; color: var(--accent);
      text-decoration: none; opacity: 0.7;
    }
    .footer a:hover { opacity: 1; }
  </style>
</head>
<body>
<div class="popup-wrap">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <svg class="logo-svg" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34e89e"/>
            <stop offset="100%" stop-color="#0fabbc"/>
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="8" fill="url(#lg)"/>
        <polygon points="12,10 24,16 12,22" fill="white"/>
      </svg>
      <div>
        <div class="header-name">Unipegaso Unlocker</div>
      </div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle" checked>
      <span class="slider-track"></span>
    </label>
  </div>

  <!-- BANNER RECENSIONE (rimosso) -->

  <!-- STATUS BAR -->
  <div class="status-bar on" id="status-bar">
    <div class="status-dot"></div>
    <span id="status-text">Attivo — scorrimento automatico</span>
  </div>

  <!-- SETTINGS -->
  <div class="settings">

    <div class="setting-row">
      <div class="setting-label">
        <span>⏱ Delay tra lezioni</span>
        <span class="setting-value" id="delay-val">0s</span>
      </div>
      <input type="range" id="delay-slider" min="0" max="30" step="1" value="0">
      <div class="setting-desc">Valore consigliato: 0 secondi </div>
    </div>

    <div class="setting-row">
      <div class="setting-label" style="margin-bottom:8px;">
        <span>⏭ Avanzamento lezioni</span>
      </div>
      <div class="mode-switch">
        <button class="mode-btn active" id="btn-skip-on-green">⚡ Avanza subito</button>
        <button class="mode-btn" id="btn-watch-full">▶️ Fino alla fine</button>
      </div>
    </div>

    <div id="infoArea"    class="alert"></div>
    <div id="errorArea"   class="alert"></div>
    <div id="warningArea" class="alert"></div>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    <span class="footer-v" id="footer-version"></span>
    <span style="font-size:10px;color:#0fabbc;font-weight:600;">Unipegaso Unlocker</span>
  </div>

</div>
<script src="popup.js"></script>
</body>
</html>
